    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c12;
            color: #d0d8e2;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('background.png') center/cover no-repeat;
            animation: floatBg 30s ease-in-out infinite alternate;
            z-index: 0;
            opacity: 0.4;
            pointer-events: none;
        }

        @keyframes floatBg {
            0% { transform: scale(1) rotate(0deg); }
            100% { transform: scale(1.1) rotate(3deg); }
        }

        ::selection {
            background: #7a8a9a;
            color: #0a0c12;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #141a24;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a4454;
            border-radius: 4px;
        }

        .glass-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 450px;
        }

        .glass-container {
            position: relative;
            background: rgba(18, 24, 34, 0.7);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border-radius: 24px;
            padding: 32px 28px 34px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            overflow: visible;
            aspect-ratio: 450 / 880;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .glass-container::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: url('profiledeco.png') center/cover no-repeat;
            background-size: 100% 100%;
            opacity: 0.85;
            z-index: -1;
            pointer-events: none;
            border-radius: 28px;
            animation: pulseBorder 4s ease-in-out infinite alternate;
        }

        @keyframes pulseBorder {
            0% { opacity: 0.7; transform: scale(0.99); }
            100% { opacity: 1; transform: scale(1.01); }
        }

        .glass-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.02) 0%, transparent 70%);
            pointer-events: none;
            border-radius: 24px;
            z-index: 0;
        }

        .profile-section {
            text-align: center;
            margin-bottom: 22px;
            position: relative;
            z-index: 1;
        }

        .avatar-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
        }

        .avatar-ring {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2a3444, #1a222e);
            padding: 3px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }

        .avatar-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
            object-fit: cover;
            background: #0a0c12;
        }

        .avatar-glow {
            position: absolute;
            top: -6px;
            left: -6px;
            width: 92px;
            height: 92px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
            mix-blend-mode: screen;
            animation: glowPulse 3s ease-in-out infinite alternate;
        }

        @keyframes glowPulse {
            0% { opacity: 0.5; transform: scale(0.98); }
            100% { opacity: 0.7; transform: scale(1.02); }
        }

        .avatar-glow img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            border-radius: 50%;
            opacity: 1;
        }

        .profile-name {
            font-size: 28px;
            font-weight: 700;
            color: #ece8e0;
            letter-spacing: -0.3px;
            margin-bottom: 2px;
        }

        .profile-badge {
            display: inline-block;
            margin: 6px 0 10px;
        }

        .profile-badge img {
            height: 26px;
            width: auto;
            border-radius: 6px;
        }

        .role-tag {
            display: inline-block;
            background: rgba(26, 34, 46, 0.7);
            border: 1px solid rgba(42, 52, 68, 0.5);
            padding: 4px 22px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            color: #a0b0be;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.06), transparent);
            margin: 18px 0 22px;
            position: relative;
            z-index: 1;
        }

        .social-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        .social-item {
            background: rgba(18, 24, 34, 0.5);
            border: 1px solid rgba(42, 52, 68, 0.3);
            border-radius: 16px;
            padding: 16px 6px;
            text-align: center;
            text-decoration: none;
            color: #b0c0ce;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }

        .social-item:hover {
            background: rgba(26, 34, 46, 0.7);
            border-color: rgba(90, 106, 122, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .social-item .social-icon {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-item .social-icon svg {
            width: 30px;
            height: 30px;
            fill: currentColor;
        }

        .social-item .social-label {
            font-size: 8px;
            font-weight: 500;
            color: #6a7a8a;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .footer-note {
            text-align: center;
            color: #3a4a5a;
            font-size: 9px;
            padding-top: 20px;
            letter-spacing: 1.5px;
            font-weight: 300;
            margin-top: 6px;
            border-top: 1px solid rgba(26, 34, 46, 0.4);
            position: relative;
            z-index: 1;
        }

        @media (max-width: 500px) {
            .glass-wrapper {
                max-width: 100%;
                padding: 0 4px;
            }

            .glass-container {
                padding: 24px 18px 26px;
                border-radius: 20px;
                aspect-ratio: auto;
                min-height: 600px;
            }

            .glass-container::before {
                top: -3px;
                left: -3px;
                right: -3px;
                bottom: -3px;
                border-radius: 23px;
            }

            .profile-name {
                font-size: 24px;
            }

            .social-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 8px;
            }

            .social-item {
                padding: 14px 4px;
            }

            .social-item .social-icon {
                width: 28px;
                height: 28px;
            }

            .social-item .social-icon svg {
                width: 24px;
                height: 24px;
            }
        }

        @media (max-width: 380px) {
            .glass-container {
                padding: 18px 14px 20px;
                border-radius: 16px;
                min-height: 520px;
            }

            .glass-container::before {
                top: -2px;
                left: -2px;
                right: -2px;
                bottom: -2px;
                border-radius: 18px;
            }

            .profile-name {
                font-size: 20px;
            }

            .social-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
